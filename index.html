<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHE DUE UOVA! | Freschezza a 22 anni</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --primary: #ffcc00; 
            --secondary: #2ecc71; 
            --dark: #2c3e50;
            --light: rgba(255, 255, 255, 0.9);
        }

        body { 
            font-family: 'Quicksand', sans-serif; 
            margin: 0; 
            color: var(--dark); 
            line-height: 1.6;
            background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        
        header { 
            background: var(--primary); 
            padding: 60px 20px; 
            text-align: center; 
            border-bottom: 8px solid var(--dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        h1 { 
            font-size: 4rem; 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: -1px; 
            color: var(--dark); 
            font-weight: 700;
        }

        .tagline { font-size: 1.4rem; font-weight: 600; margin-top: 10px; }

        .mini-bio { 
            max-width: 700px; 
            margin: -30px auto 40px; 
            background: white; 
            padding: 25px; 
            border: 3px solid var(--dark);
            text-align: center;
            box-shadow: 10px 10px 0px var(--secondary);
            position: relative;
            z-index: 10;
            border-radius: 15px;
        }

        .container { max-width: 800px; margin: auto; padding: 20px; }

        .section-card { 
            background: var(--light); 
            padding: 40px; 
            border-radius: 30px; 
            border: 2px solid var(--dark);
            margin-bottom: 50px;
            backdrop-filter: blur(5px);
        }

        h2 { font-size: 2.2rem; text-align: center; color: var(--dark); text-transform: uppercase; margin-top: 0; font-weight: 700; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 1.1rem; }
        
        input, select { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid var(--dark); 
            border-radius: 15px; 
            box-sizing: border-box;
            font-size: 1rem;
            background: #fff;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-paypal { 
            background: #0070ba; 
            color: white; 
            width: 100%; 
            padding: 20px; 
            border: none; 
            border-radius: 50px; 
            font-size: 1.4rem; 
            font-weight: 700; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Quicksand', sans-serif;
        }
